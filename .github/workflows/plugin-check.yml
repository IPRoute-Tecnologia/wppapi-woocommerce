name: Plugin Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin Check (PCP)
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: wppapi-for-woocommerce
          slug: wppapi-for-woocommerce
